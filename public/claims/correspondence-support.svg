<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Claims correspondence moving through an approval queue</title>
  <desc id="desc">A letter sheet, a source note, and a sender log connected by routed lines.</desc>
  <rect width="1200" height="900" fill="#f0eadd"/>
  <g fill="none" stroke="#13251d" stroke-width="2">
    <rect x="50" y="50" width="1100" height="800"/>
    <path d="M50 150H1150M50 240H1150"/>
    <path d="M120 150V850M1050 150V850"/>
  </g>
  <text x="84" y="106" fill="#b4472a" font-family="Courier New, monospace" font-size="20" letter-spacing="4">CLAIMS CORRESPONDENCE</text>
  <text x="84" y="205" fill="#13251d" font-family="Georgia, serif" font-size="54">Prepare. Check. Queue. Log.</text>
  <g transform="translate(120 290)">
    <rect width="390" height="420" fill="#fffdf6" stroke="#13251d" stroke-width="2"/>
    <path d="M0 62H390" stroke="#13251d" stroke-width="2"/>
    <text x="26" y="40" fill="#b4472a" font-family="Courier New, monospace" font-size="15" letter-spacing="2">APPROVED LETTER</text>
    <g stroke="#b9cbb9" stroke-width="5" stroke-linecap="round">
      <path d="M30 108H350M30 142H330M30 176H350M30 210H290M30 244H340M30 278H310"/>
    </g>
    <g stroke="#13251d" stroke-width="1"><path d="M30 320H350M30 348H350M30 376H350"/></g>
    <text x="30" y="306" fill="#5e675f" font-family="Courier New, monospace" font-size="14">CLAIM REFERENCE / SOURCE DATE</text>
    <circle cx="316" cy="52" r="42" fill="#b4472a" opacity=".9"/>
    <text x="288" y="49" fill="#faf5e9" font-family="Courier New, monospace" font-size="12">SOURCE</text>
    <text x="296" y="66" fill="#faf5e9" font-family="Courier New, monospace" font-size="12">LINKED</text>
  </g>
  <g transform="translate(690 290)">
    <rect width="360" height="420" fill="#bfd2c0" stroke="#13251d" stroke-width="2"/>
    <text x="26" y="40" fill="#13251d" font-family="Courier New, monospace" font-size="15" letter-spacing="2">CONTACT LOG</text>
    <g stroke="#13251d" stroke-width="1">
      <path d="M24 72H336M24 154H336M24 236H336M24 318H336"/>
    </g>
    <g fill="#13251d" font-family="Courier New, monospace" font-size="13">
      <text x="26" y="104">MESSAGE PREPARED</text>
      <text x="26" y="186">RECIPIENT CHECKED</text>
      <text x="26" y="268">APPROVAL QUEUED</text>
      <text x="26" y="350">RESPONSE RECORDED</text>
    </g>
    <g fill="#b4472a">
      <circle cx="316" cy="98" r="6"/><circle cx="316" cy="180" r="6"/><circle cx="316" cy="262" r="6"/><circle cx="316" cy="344" r="6"/>
    </g>
  </g>
  <g fill="none" stroke="#b4472a" stroke-width="3" stroke-dasharray="9 9">
    <path d="M520 500H620V420H680"/>
    <path d="M520 600H640V680H680"/>
  </g>
  <g fill="#13251d">
    <circle cx="620" cy="420" r="7"/><circle cx="640" cy="680" r="7"/>
  </g>
  <text x="548" y="412" fill="#b4472a" font-family="Courier New, monospace" font-size="14">STANDARD MESSAGE</text>
  <text x="548" y="716" fill="#b4472a" font-family="Courier New, monospace" font-size="14">DECISION QUESTION</text>
  <rect x="120" y="758" width="930" height="58" fill="#13251d"/>
  <text x="146" y="794" fill="#f0eadd" font-family="Courier New, monospace" font-size="17" letter-spacing="2">NO COVERAGE, VALUE, OR SETTLEMENT OPINION IS GIVEN IN CORRESPONDENCE.</text>
</svg>
